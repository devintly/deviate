<!DOCTYPE html>
<html lang="ru" data-i18n-document-title="list_editor_title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DeviateProxy — Редактор правил</title>
  <script src="platform.js"></script>
  <style>
    :root {
      --editor-line-height: 22px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #1e1f22; color: #f2f3f5; font-family: Tahoma, Arial, sans-serif; height: 100%; min-height: 100vh; min-height: 100dvh; }
    body { display: flex; flex-direction: column; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 16px; padding-top: max(8px, env(safe-area-inset-top)); background: #2b2d31; flex-shrink: 0; }
    .title { font-size: 18px; font-weight: 700; line-height: 1.2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .status { font-size: 13px; font-weight: 600; color: #57f287; white-space: nowrap; }
    .status:empty { display: none; }
    button { border: 0; border-radius: 10px; padding: 10px 14px; background: #017df1; color: #fff; font-weight: 700; cursor: pointer; min-height: 40px; transition: background 0.15s; }
    button:hover { background: #016bcf; }
    .panes { flex: 1; display: flex; gap: 16px; min-height: 0; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .pane .label { font-size: 11px; text-transform: uppercase; color: #b5bac1; font-weight: 700; margin: 0 0 8px; }
    .editor-container {
      flex: 1;
      display: flex;
      min-height: 0;
      background: #111214;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #232428;
      position: relative;
      transition: border-color 0.15s ease;
    }
    .editor-container:focus-within {
      border-color: #3f4248;
    }
    .editor-container.has-error {
      border-color: rgba(218, 55, 60, 0.6);
    }
    .gutter {
      width: 46px;
      min-width: 46px;
      background: #16171a;
      border-right: 1px solid #232428;
      overflow: hidden;
      padding: 14px 6px 14px 4px;
      user-select: none;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: var(--editor-line-height);
      color: #5c6068;
      text-align: right;
    }
    .gutter-line {
      height: var(--editor-line-height);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }
    .gutter-line.invalid {
      color: #ff6b6b;
      font-weight: 700;
    }
    .gutter-line.invalid::before {
      content: "!";
      display: inline-block;
      width: 12px;
      height: 12px;
      line-height: 12px;
      text-align: center;
      font-size: 10px;
      font-weight: 900;
      color: #fff;
      background: #da373c;
      border-radius: 50%;
    }
    .editor-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }
    .backdrop {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      padding: 14px 16px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: var(--editor-line-height);
      white-space: pre;
      z-index: 1;
    }
    .hl-line {
      height: var(--editor-line-height);
      border-radius: 4px;
      margin: 0 -8px;
      padding: 0 8px;
    }
    .hl-line.invalid {
      background: rgba(218, 55, 60, 0.32);
      border-left: 3px solid #ff6b6b;
      box-shadow: 0 0 8px rgba(218, 55, 60, 0.2) inset;
    }
    textarea.code-editor {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #f2f3f5;
      caret-color: #57f287;
      padding: 14px 16px;
      resize: none;
      font-size: 14px;
      line-height: var(--editor-line-height);
      font-family: Consolas, "Courier New", monospace;
      white-space: pre;
      overflow: auto;
      z-index: 2;
    }
    @media (max-width: 700px) {
      :root {
        --editor-line-height: 24px;
      }
      .panes { flex-direction: column; }
      .pane { min-height: 220px; }
      .backdrop, textarea.code-editor { font-size: 15px; }
      .gutter { width: 42px; min-width: 42px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="title" data-i18n="list_editor_title">Редактор правил</div>
    <div class="right">
      <div id="status" class="status" aria-live="polite"></div>
      <button id="saveBtn" type="button" data-i18n="list_editor_save">Сохранить</button>
    </div>
  </div>
  <div class="panes">
    <div class="pane">
      <div class="label" data-i18n="list_editor_proxy">Проксировать</div>
      <div class="editor-container" id="proxyContainer">
        <div class="gutter" id="proxyGutter" aria-hidden="true"></div>
        <div class="editor-area">
          <div class="backdrop" id="proxyBackdrop" aria-hidden="true"></div>
          <textarea id="proxyEditor" class="code-editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="example.com&#10;*.example.com&#10;1.2.3.4"></textarea>
        </div>
      </div>
    </div>
    <div class="pane">
      <div class="label" data-i18n="list_editor_direct">Напрямую</div>
      <div class="editor-container" id="directContainer">
        <div class="gutter" id="directGutter" aria-hidden="true"></div>
        <div class="editor-area">
          <div class="backdrop" id="directBackdrop" aria-hidden="true"></div>
          <textarea id="directEditor" class="code-editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="example.com&#10;*.example.com&#10;1.2.3.4"></textarea>
        </div>
      </div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="host-rules.js"></script>
  <script src="list.js"></script>
</body>
</html>
