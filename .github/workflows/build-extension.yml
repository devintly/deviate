name: Сборка расширения

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Собрать zip/xpi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Package
        run: python3 scripts/package.py

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: deviateproxy-packages
          path: |
            dist/*.zip
            dist/*.xpi
          if-no-files-found: error

      - name: Upload unpacked extensions
        uses: actions/upload-artifact@v6
        with:
          name: deviateproxy-unpacked
          path: dist/unpacked/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip dist/*.xpi --clobber
          else
            gh release create "$tag" dist/*.zip dist/*.xpi \
              --title "DeviateProxy ${tag}" \
              --generate-notes
          fi
