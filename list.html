<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DeviateProxy — Редактор правил</title>
  <script src="platform.js"></script>
  <style>
    html, body { margin: 0; background: #1e1f22; color: #f2f3f5; font-family: Inter, Arial, sans-serif; height: 100%; min-height: 100vh; min-height: 100dvh; }
    body { display: flex; flex-direction: column; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px 8px; padding-top: max(14px, env(safe-area-inset-top)); background: #2b2d31; flex-shrink: 0; flex-wrap: nowrap; }
    .title { font-size: 18px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .right { display: flex; align-items: center; flex-shrink: 0; }
    .status { min-height: 20px; padding: 0 16px 10px; background: #2b2d31; font-size: 13px; color: #57f287; text-align: right; flex-shrink: 0; }
    button { border: 0; border-radius: 10px; padding: 10px 14px; background: #017df1; color: #fff; font-weight: 700; cursor: pointer; min-height: 40px; }
    .panes { flex: 1; display: flex; gap: 16px; min-height: 0; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .pane .label { font-size: 11px; text-transform: uppercase; color: #b5bac1; font-weight: 700; margin: 0 0 8px; }
    textarea { flex: 1; margin: 0; border: 0; outline: 0; border-radius: 14px; background: #111214; color: #f2f3f5; padding: 16px; resize: none; font-size: 14px; line-height: 1.5; font-family: Consolas, monospace; }
    @media (max-width: 700px) {
      .panes { flex-direction: column; }
      .pane { min-height: 160px; }
      textarea { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="title">Редактор правил</div>
    <div class="right">
      <button id="saveBtn" type="button">Сохранить</button>
    </div>
  </div>
  <div id="status" class="status" aria-live="polite"></div>
  <div class="panes">
    <div class="pane">
      <div class="label">Проксировать</div>
      <textarea id="proxyEditor" placeholder="example.com&#10;*.example.com&#10;1.2.3.4"></textarea>
    </div>
    <div class="pane">
      <div class="label">Напрямую</div>
      <textarea id="directEditor" placeholder="example.com&#10;*.example.com&#10;1.2.3.4"></textarea>
    </div>
  </div>
  <script src="list.js"></script>
</body>
</html>
