<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Deviate — Редактор правил</title>
  <style>
    body { margin: 0; background: #1e1f22; color: #f2f3f5; font-family: Inter, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #2b2d31; flex-shrink: 0; }
    .title { font-size: 18px; font-weight: 700; }
    .right { display: flex; align-items: center; gap: 12px; }
    .status { font-size: 13px; color: #57f287; min-width: 90px; text-align: right; }
    button { border: 0; border-radius: 10px; padding: 10px 14px; background: #f0b232; color: #1e1f22; font-weight: 700; cursor: pointer; }
    .panes { flex: 1; display: flex; gap: 16px; min-height: 0; padding: 16px; }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .pane .label { font-size: 11px; text-transform: uppercase; color: #b5bac1; font-weight: 700; margin: 0 0 8px; }
    textarea { flex: 1; margin: 0; border: 0; outline: 0; border-radius: 14px; background: #111214; color: #f2f3f5; padding: 16px; resize: none; font-size: 14px; line-height: 1.5; font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <div class="top">
    <div class="title">Редактор правил</div>
    <div class="right">
      <div id="status" class="status"></div>
      <button id="saveBtn" type="button">Сохранить</button>
    </div>
  </div>
  <div class="panes">
    <div class="pane">
      <div class="label">Проксировать</div>
      <textarea id="proxyEditor" placeholder="example.com&#10;*.example.com&#10;1.2.3.4"></textarea>
    </div>
    <div class="pane">
      <div class="label">Напрямую</div>
      <textarea id="directEditor" placeholder="example.com&#10;*.example.com&#10;1.2.3.4"></textarea>
    </div>
  </div>
  <script src="list.js"></script>
</body>
</html>
